name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun test
      - name: Types
        run: bunx tsc -p jsconfig.json
      - name: Kernel line budget
        run: |
          lines=$(cat src/*.js | wc -l)
          echo "kernel: $lines/600 lines"
          [ "$lines" -le 600 ]
