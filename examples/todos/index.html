<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>auril.js todos</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 30rem;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    h1 { font-weight: 200; font-size: 3rem; text-align: center; margin: 0 0 1rem; opacity: .4; }
    .new-todo, .search, .edit {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      padding: .6rem .8rem;
      border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      border-radius: .4rem;
      background: transparent;
      color: inherit;
    }
    .search { margin-top: .5rem; }
    .todo-list { padding: 0; margin: 1rem 0; }
    .todo-list li {
      list-style: none;
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .45rem .2rem;
      border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent);
    }
    .todo-list li.done label { text-decoration: line-through; opacity: .45; }
    .todo-list label { flex: 1; cursor: pointer; }
    .toggle { width: 1.1rem; height: 1.1rem; accent-color: #733e0a; }
    .destroy {
      border: 0; background: none; color: inherit;
      font-size: 1.1rem; cursor: pointer; opacity: .35;
    }
    .destroy:hover { opacity: 1; color: #b33; }
    footer { display: flex; align-items: center; gap: .4rem; font-size: .85rem; opacity: .8; }
    footer .spacer { flex: 1; }
    footer button {
      font: inherit; cursor: pointer; color: inherit;
      border: 1px solid transparent; border-radius: .3rem;
      background: none; padding: .15rem .5rem;
    }
    footer button[aria-pressed="true"] { border-color: color-mix(in srgb, currentColor 35%, transparent); }
    todo-stats p { text-align: center; font-size: .8rem; opacity: .5; }
  </style>
</head>
<body>
  <todo-app></todo-app>
  <todo-stats></todo-stats>
  <!-- No build step. Serve the repo root, e.g. `bun serve.js` (live reload) or
       `python3 -m http.server`, then open /examples/todos/. Add ?auril-dev to the URL
       for store/route logging. -->
  <script type="module" src="./app.js"></script>
</body>
</html>
