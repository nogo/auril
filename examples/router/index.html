<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>auril.js — router</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 30rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-weight: 200; font-size: 2.5rem; opacity: .5; margin: 0 0 1rem; }
    .notes { list-style: none; padding: 0; display: grid; gap: .5rem; }
    .notes a {
      display: block; padding: .7rem .9rem; border-radius: .4rem; color: inherit;
      border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      text-decoration: none;
    }
    .notes a:hover { border-color: color-mix(in srgb, currentColor 45%, transparent); }
    article h2 { font-weight: 400; margin: 0 0 .4rem; }
    .next { font: inherit; cursor: pointer; padding: .3rem .7rem; margin-left: .8rem;
      border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      border-radius: .4rem; background: none; color: inherit; }
    a { color: inherit; }
    body > p > a { opacity: .6; }
  </style>
</head>
<body>
  <h1>router</h1>
  <notes-app></notes-app>
  <p><a class="up" href="../">← All examples</a></p>
  <!-- On a deep link (…/router/note/3) a relative URL resolves against the note
       path, so pin both the module and the way out to this demo's directory.
       Derived rather than absolute so the demo also works under a path prefix
       (GitHub Pages serves the repo at /auril/). -->
  <script type="module">
    const dir = location.pathname.replace(/(\/router\/).*$/, '$1');
    document.querySelector('.up').href = dir + '../';
    import(dir + 'app.js');
  </script>
</body>
</html>
